name = "uptimeflare_worker"
main = "src/index.ts"
compatibility_date = "2025-04-02"
compatibility_flags = [ "nodejs_compat" ]

[triggers]
# Cron is only a supervisor: it re-arms the Durable Object alarm when it went
# missing and force-re-arms when checks went stale. The 10-minute cadence
# itself lives in the MonitorScheduler alarm.
crons = [ "0 * * * *" ]

[[d1_databases]]
binding = "UPTIMEFLARE_D1"
database_name = "uptimeflare_d1"
database_id = "00000000-0000-0000-0000-000000000000"

[[durable_objects.bindings]]
name = "MONITOR_SCHEDULER_DO"
class_name = "MonitorScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RemoteChecker"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MonitorScheduler"]

[[migrations]]
tag = "v3"
deleted_classes = ["RemoteChecker"]
