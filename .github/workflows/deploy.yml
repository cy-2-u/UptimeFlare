name: Deploy to Cloudflare

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Never run two deploys concurrently: overlapping wrangler/API mutations
# would race on bindings and deployments.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install packages
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build worker (dry-run)
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Ensure D1 storage
        run: node scripts/storage-setup.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate worker deploy config
        run: node scripts/worker-config.mjs
        env:
          D1_ID: ${{ env.D1_ID }}

      - name: Deploy worker (with static assets)
        run: npx wrangler deploy --config wrangler.deploy.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      # Also arms the Durable Object alarm right after a fresh deployment.
      - name: Health check
        run: node scripts/health-check.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
