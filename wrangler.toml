name = "uptimeflare_worker"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "./assets"
not_found_handling = "404-page"
# Pages are server-rendered by the Worker; static files (css/js/favicon/404) stay asset-served.
run_worker_first = ["/", "/manage", "/login", "/m/*", "/api/*", "/health", "/trigger"]

[triggers]
crons = ["0 * * * *"]

[[durable_objects.bindings]]
name = "MONITOR_SCHEDULER_DO"
class_name = "MonitorScheduler"

# Applied migration ledger: v1/v2/v3 already exist on the live object and must
# stay in order. v3 removed the pre-merge RemoteChecker class.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RemoteChecker"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MonitorScheduler"]

[[migrations]]
tag = "v3"
deleted_classes = ["RemoteChecker"]
