name = "uptimeflare_worker"
main = "src/index.tsx"
compatibility_date = "2025-04-02"
compatibility_flags = [ "nodejs_compat" ]

# Static assets are served before the Worker runs and do not count against
# the free plan request quota. Unmatched paths fall through to the Worker.
[assets]
directory = "./assets"

[triggers]
# Cron is only a supervisor: it re-arms the Durable Object alarm when it went
# missing and force-re-arms when rounds went stale. The real cadence lives in
# the MonitorScheduler alarm.
crons = [ "0 * * * *" ]

[[d1_databases]]
binding = "UPTIMEFLARE_D1"
database_name = "uptimeflare_d1"
database_id = "00000000-0000-0000-0000-000000000000"

[[durable_objects.bindings]]
name = "MONITOR_SCHEDULER_DO"
class_name = "MonitorScheduler"

# Migration ledger must stay identical to what production already applied
# (v1 RemoteChecker, v2 MonitorScheduler, v3 RemoteChecker removal) so the
# Durable Object namespace — and its stored monitor list — carries over.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RemoteChecker"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MonitorScheduler"]

[[migrations]]
tag = "v3"
deleted_classes = ["RemoteChecker"]
